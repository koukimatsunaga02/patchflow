<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="description" content="PATCHFLOWのワークスペース。音響・映像の配線プロジェクトを保存して、現場やチームにつなげる。">
<title>ワークスペース | PATCHFLOW</title>
<link rel="stylesheet" href="account.css?v=21">
<script src="account.js?v=21" defer></script>
</head>
<body>
<header class="account-header">
<a class="brand" href="./" aria-label="PATCHFLOW トップページ"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M5 25V11h8v14h10V11h8v14M13 18h10" fill="none" stroke="currentColor" stroke-width="3.5"/></svg><span>patchflow<small>signal design studio</small></span></a>
<div class="header-location"><span>WORKSPACE</span><b id="headerlabel">プロジェクトの保管場所</b></div>
<div class="header-actions"><a class="text-link" href="editor.html">ゲストで試す <span aria-hidden="true">↗</span></a><button id="accounttheme" class="icon-button" aria-label="表示テーマを切り替え"></button><div id="accountprofile"></div></div>
</header>
<main id="accountmain" aria-busy="true"><div class="boot-state"><span class="loading-dot"></span><p>ワークスペースを開いています</p></div></main>
<input type="file" id="accountfile" accept="application/json,.json" hidden>
<div id="accounttoast" role="status" aria-live="polite" hidden></div>
<noscript><div class="noscript">ワークスペースを利用するにはJavaScriptを有効にしてください。<a href="editor.html">エディターを開く</a></div></noscript>

</html>
